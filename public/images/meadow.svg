<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sunlit meadow with hazy ridgelines at golden hour">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf4e3"/>
      <stop offset="0.42" stop-color="#f8e3b6"/>
      <stop offset="0.72" stop-color="#f2cd8c"/>
      <stop offset="1" stop-color="#eab96f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#fff8e7" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffefc8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffefc8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2ae8d"/>
      <stop offset="1" stop-color="#a08e72"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9678"/>
      <stop offset="1" stop-color="#7f7c60"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77814e"/>
      <stop offset="1" stop-color="#5f6a3c"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#68743f"/>
      <stop offset="1" stop-color="#47522b"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf4e3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fdf4e3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fdf4e3" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- sun disc -->
  <circle cx="1152" cy="234" r="118" fill="#fff6dd" opacity="0.55" filter="url(#softer)"/>
  <circle cx="1152" cy="234" r="52" fill="#fff9ea" opacity="0.95" filter="url(#soft)"/>

  <!-- birds -->
  <g stroke="#5b4f3a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M420 200 q 14 -12 28 0 q 14 -12 28 0"/>
    <path d="M512 168 q 10 -9 20 0 q 10 -9 20 0"/>
  </g>

  <!-- far ridge -->
  <path d="M0 545 C 130 478 250 512 372 476 C 500 440 596 502 724 476 C 848 452 952 514 1082 486 C 1204 460 1302 512 1426 492 C 1492 482 1546 506 1600 494 L1600 900 L0 900 Z" fill="url(#far)" opacity="0.62" filter="url(#softer)"/>

  <!-- mid ridge -->
  <path d="M0 632 L 96 566 L 178 604 L 268 534 L 356 598 L 436 552 L 528 606 L 616 546 L 706 592 L 816 522 L 906 588 L 986 552 L 1088 600 L 1186 540 L 1284 594 L 1364 560 L 1454 600 L 1532 564 L 1600 590 L1600 900 L0 900 Z" fill="url(#mid)" opacity="0.85"/>

  <!-- haze over the horizon -->
  <rect x="0" y="470" width="1600" height="160" fill="url(#haze)" filter="url(#soft)"/>

  <!-- near hills -->
  <path d="M0 726 C 150 662 268 704 406 672 C 546 640 648 708 786 688 C 926 668 1028 720 1166 696 C 1304 672 1406 720 1600 704 L1600 900 L0 900 Z" fill="url(#hill)"/>
  <path d="M0 782 C 170 740 320 776 470 756 C 640 732 780 788 940 772 C 1120 754 1290 796 1600 776 L1600 900 L0 900 Z" fill="#4d5930" opacity="0.85"/>

  <!-- meadow foreground -->
  <rect x="0" y="780" width="1600" height="120" fill="url(#meadow)"/>

  <!-- flowers -->
  <g>
    <g fill="#fdfbf4">
      <circle cx="64" cy="826" r="6"/><circle cx="132" cy="854" r="4.5"/><circle cx="212" cy="832" r="5.5"/>
      <circle cx="296" cy="860" r="4"/><circle cx="352" cy="828" r="6"/><circle cx="452" cy="852" r="4.5"/>
      <circle cx="540" cy="830" r="5"/><circle cx="646" cy="858" r="4"/><circle cx="742" cy="834" r="6"/>
      <circle cx="836" cy="862" r="4.5"/><circle cx="936" cy="836" r="5.5"/><circle cx="1042" cy="858" r="4"/>
      <circle cx="1136" cy="832" r="6"/><circle cx="1244" cy="860" r="4.5"/><circle cx="1338" cy="836" r="5"/>
      <circle cx="1432" cy="856" r="4.5"/><circle cx="1526" cy="834" r="5.5"/>
    </g>
    <g fill="#f3cdd8">
      <circle cx="98" cy="848" r="5"/><circle cx="252" cy="846" r="4"/><circle cx="398" cy="862" r="5"/>
      <circle cx="498" cy="844" r="4"/><circle cx="596" cy="824" r="3.5"/><circle cx="688" cy="848" r="4.5"/>
      <circle cx="796" cy="848" r="3.5"/><circle cx="886" cy="826" r="4"/><circle cx="990" cy="850" r="4.5"/>
      <circle cx="1092" cy="846" r="3.5"/><circle cx="1188" cy="822" r="4"/><circle cx="1292" cy="846" r="4.5"/>
      <circle cx="1382" cy="820" r="3.5"/><circle cx="1478" cy="844" r="4"/><circle cx="1568" cy="862" r="4.5"/>
    </g>
    <g fill="#eebc53">
      <circle cx="168" cy="838" r="4"/><circle cx="330" cy="852" r="3.5"/><circle cx="430" cy="838" r="4"/>
      <circle cx="568" cy="856" r="3.5"/><circle cx="626" cy="840" r="4"/><circle cx="808" cy="866" r="3.5"/>
      <circle cx="906" cy="844" r="4"/><circle cx="1012" cy="828" r="3.5"/><circle cx="1110" cy="864" r="4"/>
      <circle cx="1218" cy="840" r="3.5"/><circle cx="1316" cy="864" r="4"/><circle cx="1416" cy="828" r="3.5"/>
      <circle cx="1502" cy="848" r="4"/><circle cx="60" cy="864" r="3.5"/>
    </g>
    <g fill="#fdfbf4" filter="url(#soft)" opacity="0.85">
      <circle cx="180" cy="880" r="6"/><circle cx="410" cy="886" r="5"/><circle cx="660" cy="878" r="6"/>
      <circle cx="920" cy="886" r="5"/><circle cx="1160" cy="880" r="6"/><circle cx="1400" cy="886" r="5"/>
    </g>
  </g>

  <!-- gentle light wash from the top-left -->
  <rect width="1600" height="900" fill="#fff8e7" opacity="0.08"/>
</svg>
